<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Vesyn — multi-agent chemistry workbench">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8FAF9A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8FAF9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FAF9A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FAF9A" stop-opacity="0"/>
    </linearGradient>
    <g id="atoms" fill="none">
      <path d="M0 40 80 0 160 40 160 120 80 160 0 120Z" stroke="#545449" stroke-width="1.2" opacity="0.55"/>
      <path d="M80 0 80 160M0 40 160 120M160 40 0 120" stroke="#363730" stroke-width="1"/>
      <circle cx="0" cy="40" r="6" fill="#B87552" opacity="0.8"/>
      <circle cx="80" cy="0" r="5" fill="#E8E4D8" opacity="0.5"/>
      <circle cx="160" cy="40" r="6" fill="#8FAF9A" opacity="0.8"/>
      <circle cx="160" cy="120" r="5" fill="#E8E4D8" opacity="0.5"/>
      <circle cx="80" cy="160" r="6" fill="#D6A45B" opacity="0.7"/>
      <circle cx="0" cy="120" r="5" fill="#E8E4D8" opacity="0.5"/>
      <circle cx="80" cy="80" r="8" fill="#8FAF9A" opacity="0.35"/>
    </g>
  </defs>

  <rect width="1280" height="300" fill="#10110F"/>
  <rect width="1280" height="300" fill="url(#glow)"/>
  <g opacity="0.75"><use href="#atoms" x="905" y="48"/></g>

  <!-- mark: the four-atom diamond from the app header -->
  <g transform="translate(64 78) scale(2.1)">
    <circle cx="5" cy="12" r="2.4" fill="#8FAF9A"/>
    <circle cx="12" cy="5" r="2" fill="#E8E4D8"/>
    <circle cx="12" cy="19" r="2" fill="#E8E4D8"/>
    <circle cx="19" cy="12" r="2.4" fill="#8FAF9A"/>
    <path d="M5 12 12 5M5 12l7 7M12 5l7 7M12 19l7-7" stroke="#545449" stroke-width="1.2" fill="none"/>
  </g>

  <text x="132" y="122" font-family="'Segoe UI Semibold','Segoe UI',Inter,system-ui,sans-serif" font-size="58" letter-spacing="7" fill="#E8E4D8">VE<tspan fill="#8FAF9A">syn</tspan></text>
  <text x="136" y="156" font-family="Consolas,'Cascadia Mono','JetBrains Mono',monospace" font-size="13" letter-spacing="5.5" fill="#A9A79C">MULTI-AGENT CHEMISTRY WORKBENCH</text>
  <rect x="64" y="180" width="300" height="1.5" fill="url(#rule)"/>

  <text x="64" y="222" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#C9C1A8">Ask in plain words. Agents answer with <tspan font-style="italic" fill="#E8E4D8">real tools</tspan> —</text>
  <text x="64" y="256" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#C9C1A8">and show their work.</text>

  <g font-family="Consolas,'Cascadia Mono','JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="#A9A79C" text-anchor="middle">
    <rect x="560" y="236" width="150" height="26" rx="13" fill="#191B18" stroke="#545449" stroke-width="1"/>
    <text x="635" y="253">RETROSYNTHESIS</text>
    <rect x="720" y="236" width="112" height="26" rx="13" fill="#191B18" stroke="#545449" stroke-width="1"/>
    <text x="776" y="253">SOLUBILITY</text>
    <rect x="842" y="236" width="112" height="26" rx="13" fill="#191B18" stroke="#545449" stroke-width="1"/>
    <text x="898" y="253">PROPERTIES</text>
    <rect x="964" y="236" width="106" height="26" rx="13" fill="#191B18" stroke="#545449" stroke-width="1"/>
    <text x="1017" y="253">ANALOGUES</text>
    <rect x="1080" y="236" width="86" height="26" rx="13" fill="#191B18" stroke="#545449" stroke-width="1"/>
    <text x="1123" y="253">PROFILE</text>
  </g>
</svg>
