name: vesyn  # volume becomes vesyn_pgdata, independent of RamChems' ramchems_pgdata

services:
  db:
    # PINNED DELIBERATELY - DO NOT BUMP IN ISOLATION.
    # This tag ships RDKit 2023.09, matching the Python-side rdkit==2023.09.6 that
    # AiZynthFinder's `rdkit<2024.0.0` constraint forces on us. Python and the
    # cartridge must agree on canonicalization; if they drift, the symptom is
    # "search returns weird results", not a clean error.
    # Coupled to: requirements.txt (aizynthfinder -> rdkit). Move both together.
    image: informaticsmatters/rdkit-cartridge-debian:Release_2023_09_3
    container_name: vesyn_db
    environment:
      POSTGRES_USER: vesyn
      POSTGRES_PASSWORD: vesyn
      POSTGRES_DB: vesyn
      # This image's initdb defaults to SQL_ASCII, which does no encoding
      # validation and makes psycopg hand back bytes instead of str for text
      # columns. Force UTF8 at cluster creation - it cannot be changed later
      # without recreating the volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 127.0.0.1 only - not reachable from the network.
      # 5437: 5432-5436 are taken on this machine (RamChems keeps 5434).
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesyn -d vesyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  hindsight:
    # Research memory - backend/mas/memory.py. Pinned: the API is still 0.x.
    image: ghcr.io/vectorize-io/hindsight:0.10.1
    container_name: vesyn_hindsight
    environment:
      # The LLM Hindsight runs to extract facts on retain (recall needs none).
      # Default: this machine's Ollama - free, no key. Hosted options: .env.example.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-ollama}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-qwen3:14b}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      # Hindsight defaults Groq to service_tier "auto", which free-tier orgs are refused (HTTP 400).
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: ${HINDSIGHT_API_LLM_GROQ_SERVICE_TIER:-on_demand}
    ports:
      - "127.0.0.1:8888:8888"  # API
      - "127.0.0.1:9999:9999"  # Hindsight's own UI: browse the memory bank
    volumes:
      - hindsight:/home/hindsight/.pg0

volumes:
  pgdata:
  hindsight:
