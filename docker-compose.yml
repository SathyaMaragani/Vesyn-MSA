name: vesyn  # volume becomes vesyn_pgdata, independent of RamChems' ramchems_pgdata

services:
  db:
    # PINNED DELIBERATELY - DO NOT BUMP IN ISOLATION.
    # This tag ships RDKit 2023.09, matching the Python-side rdkit==2023.09.6 that
    # AiZynthFinder's `rdkit<2024.0.0` constraint forces on us. Python and the
    # cartridge must agree on canonicalization; if they drift, the symptom is
    # "search returns weird results", not a clean error.
    # Coupled to: requirements.txt (aizynthfinder -> rdkit). Move both together.
    image: informaticsmatters/rdkit-cartridge-debian:Release_2023_09_3
    container_name: vesyn_db
    environment:
      POSTGRES_USER: vesyn
      POSTGRES_PASSWORD: vesyn
      POSTGRES_DB: vesyn
      # This image's initdb defaults to SQL_ASCII, which does no encoding
      # validation and makes psycopg hand back bytes instead of str for text
      # columns. Force UTF8 at cluster creation - it cannot be changed later
      # without recreating the volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 127.0.0.1 only - not reachable from the network.
      # 5437: 5432-5436 are taken on this machine (RamChems keeps 5434).
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesyn -d vesyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
